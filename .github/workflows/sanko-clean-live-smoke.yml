name: Verify clean Sanko latest diary news (live)
on:
  push:
    branches:
      - audit/sanko-clean-live-smoke-20261107
    paths:
      - .github/workflows/sanko-clean-live-smoke.yml
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify latest-day plot event and conversation correction against real Gemini
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const root='https://sanko-chat-api.boysinger2008.workers.dev';
          let health=null;
          for(let attempt=0;attempt<36;attempt++){
            try{
              const res=await fetch(root+'/health',{signal:AbortSignal.timeout(8000)});
              const data=await res.json();
              console.log('health',JSON.stringify({status:res.status,engine:data.engine,diarySync:data.diarySync?.status,latestPostDay:data.diarySync?.latestPostDay}));
              if(res.ok&&data.engine==='sanko-clean-3.0.0'){health=data;break;}
            }catch(err){console.log('health attempt unavailable',err?.name||'error');}
            await new Promise(r=>setTimeout(r,5000));
          }
          if(!health)throw Error('new_clean_worker_not_live');
          const history=[],conversationId=crypto.randomUUID();
          let hasKeyEvent=false;
          let firstResponse='';
          for(const message of ['А что у вас нового? Расскажи главное событие из последней записи Олешки.', 'Ты серьёзно? Какое именно важное событие произошло?', 'А что было вчера — чем завершился день?']){
            const res=await fetch(root+'/api/chat',{
              method:'POST',signal:AbortSignal.timeout(65000),
              headers:{'Origin':'https://socman2023.github.io','Content-Type':'application/json'},
              body:JSON.stringify({message,conversationId,history})
            });
            const data=await res.json().catch(()=>({error:'invalid_json_reply'}));
            const reply=typeof data.reply==='string'?data.reply:'';
            console.log('chat',JSON.stringify({http:res.status,message,
              reply:reply.slice(0,1000),error:data.error||null,
              model:data.model||null,knowledge:data.knowledge||null}));
            if(!res.ok||!reply.trim())throw Error('live_chat_failed_'+res.status+'_'+(data.error||''));
            if(!history.length)firstResponse=reply;
            if(/ратш/iu.test(reply)&&/элин/iu.test(reply))hasKeyEvent=true;
            history.push({role:'user',text:message},{role:'model',text:reply});
          }
          console.log('keyEventMentioned',hasKeyEvent,'firstResponse',firstResponse.slice(0,300));
          if(!hasKeyEvent)throw Error('live_chat_ignored_main_rescue_event');
          console.log('PASS: live recent-day news and correction flow completed');
          NODE
