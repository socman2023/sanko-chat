name: Sanko next - actual Wrangler dry-run build (isolated)
on:
  push:
    branches:
      - build/sanko-clean-wrangler-check-20261107
    paths:
      - sanko-rebuild-clean/**
      - .github/workflows/sanko-next-build-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify checked-out clean source tree, no archive extraction
        shell: bash
        run: |
          test -f sanko-rebuild-clean/runtime/index.mjs
          test -f sanko-rebuild-clean/runtime/admin-readonly.mjs
          test -f sanko-rebuild-clean/engine/conversation.mjs
          test -f sanko-rebuild-clean/chronicle/live-snapshot.mjs
          test -f worker/src/admin-ui.js
          echo 'PASS: clean Worker code is checked out directly from this isolated GitHub branch'
      - name: Inspect source integrity and attach byte-identical approved admin UI
        shell: bash
        run: |
          node sanko-rebuild-clean/runtime/tools/attach-admin-ui.mjs worker/src/admin-ui.js
          node sanko-rebuild-clean/runtime/tools/check-worker-graph.mjs
          for f in sanko-rebuild-clean/runtime/*.mjs sanko-rebuild-clean/engine/*.mjs sanko-rebuild-clean/chronicle/*.mjs; do node --check "$f"; done
      - name: Install Wrangler in isolated source tree
        shell: bash
        run: npm install --prefix sanko-rebuild-clean --no-save --no-package-lock wrangler@4
      - name: Actual Wrangler compilation, dry-run only, fake resource IDs
        shell: bash
        run: |
          bash sanko-rebuild-clean/runtime/staging/dryrun-build.sh \
            "$PWD/worker/src/admin-ui.js" "$PWD/sanko-rebuild-clean/.wrangler-dryrun-stage11"
          test -n "$(find sanko-rebuild-clean/.wrangler-dryrun-stage11 -type f -print -quit)"
      - name: Move successful Wrangler output into a visible artifact folder
        shell: bash
        run: |
          mkdir -p compiled-worker
          cp -a sanko-rebuild-clean/.wrangler-dryrun-stage11/. compiled-worker/
          find compiled-worker -type f -maxdepth 3 -print
          test -n "$(find compiled-worker -type f -print -quit)"
      - name: Smoke test the actual Worker in local Cloudflare runtime, no cloud access
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$(node sanko-rebuild-clean/runtime/staging/make-dryrun-config.mjs)"
          node sanko-rebuild-clean/runtime/staging/verify-staging.mjs "$CONFIG" --compile-only
          sanko-rebuild-clean/node_modules/.bin/wrangler dev \
            --config "$CONFIG" --local --port 8788 --ip 127.0.0.1 > /tmp/sanko-clean-dev.log 2>&1 &
          WORKER_PID=$!
          cleanup() { kill "$WORKER_PID" 2>/dev/null || true; rm -f "$CONFIG"; }
          trap cleanup EXIT
          ready=0
          for n in $(seq 1 24); do
            if curl -fsS --max-time 2 http://127.0.0.1:8788/health -o /tmp/sanko-health.json; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/sanko-clean-dev.log; exit 1; fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const health=JSON.parse(readFileSync('/tmp/sanko-health.json','utf8'));
          assert.equal(health.status,'staging_only');
          assert.equal(health.character,'sanko');
          assert.equal(health.realGeminiEnabled,false);
          const host='http://127.0.0.1:8788';
          const admin=await fetch(host+'/admin/stats');
          assert.equal(admin.status,200);
          assert((await admin.text()).includes('data-page="stats"'));
          const privateAdmin=await fetch(host+'/admin/stats/data',{
            method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
          assert.equal(privateAdmin.status,401);
          const session=await fetch(host+'/api/session',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({vkLaunch:'?vk_user_id=850667816&vk_app_id=54875852&sign=invalid'})});
          assert.equal(session.status,200);
          assert.equal((await session.json()).verified,false);
          const chat=await fetch(host+'/api/chat',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({message:'Привет'})});
          assert.equal(chat.status,503);
          assert.equal((await chat.json()).error,'not_configured');
          console.log('PASS: local Cloudflare runtime, health, admin UI, private data auth, forged VK, model gate');
          NODE
      - name: Save compiled output for inspection
        uses: actions/upload-artifact@v4
        with:
          name: sanko-clean-wrangler-dryrun
          path: compiled-worker/
          include-hidden-files: true
          if-no-files-found: error
