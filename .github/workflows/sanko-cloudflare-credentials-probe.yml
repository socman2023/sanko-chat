name: Sanko Cloudflare credential probe (read-only, no deploy)
on:
  push:
    branches: [build/sanko-clean-wrangler-check-20261107]
    paths: [.github/workflows/sanko-cloudflare-credentials-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check available already-configured credentials (presence only)
        env:
          SANKO_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CF_ACCOUNT_VERIFY_TOKEN: ${{ secrets.CLOUDFLARE_ACCOUNT_VERIFY_TOKEN }}
          SANKO_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SANKO_ACCOUNT_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SANKO_API_TOKEN CF_API_TOKEN CLOUDFLARE_DEPLOY_TOKEN CF_ACCOUNT_VERIFY_TOKEN SANKO_ACCOUNT_ID SANKO_ACCOUNT_VAR CF_ACCOUNT_ID; do
            if [[ -n "${!name:-}" ]]; then echo "$name: PRESENT"; else echo "$name: ABSENT"; fi
          done
          echo 'No secret values, account details, or API calls were made.'
