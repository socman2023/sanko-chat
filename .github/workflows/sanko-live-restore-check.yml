name: Verify Sanko live restoration
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sanko-live-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production Worker 0.6.10 and inspect diary freshness
        shell: bash
        env:
          LIVE_HEALTH: https://sanko-chat-api.boysinger2008.workers.dev/health
        run: |
          set -eu
          for attempt in $(seq 1 24); do
            body="$(curl -fsS --max-time 10 "$LIVE_HEALTH" || true)"
            if printf '%s' "$body" | jq -e '.version=="sanko-worker-0.6.15" and .diarySync.status=="ok"' >/dev/null 2>&1; then
              printf '%s' "$body" | jq '{version,configured,diaryConnected,diarySync}'
              echo "LIVE_HEALTH_OK=1" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Live Worker version / diary not ready (attempt $attempt of 24)."
            sleep 10
          done
          echo "Unable to independently confirm current Worker 0.6.10 with diary access" >&2
          exit 1
      - name: One controlled Sanko dialogue smoke test
        if: env.LIVE_HEALTH_OK == '1'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const { lintSankoReply } = await import("./quality/sanko/check_reply.mjs");
          const response=await fetch("https://sanko-chat-api.boysinger2008.workers.dev/api/chat",{
           method:"POST",
           headers:{"Origin":"https://socman2023.github.io","Content-Type":"application/json"},
           body:JSON.stringify({
            message:"Что ты помнишь из самых последних событий? Только без старых приключений.",
            history:[],conversationId:crypto.randomUUID()
           })
          });
          const data=await response.json();
          console.log(JSON.stringify({
           http:response.status,model:data.model,
           diaryPosts:data.knowledge?.diaryPosts,
           focusDate:data.knowledge?.focusDate,
           reply:data.reply
          },null,2));
          if(!response.ok || typeof data.reply!=="string" || !data.reply.trim())process.exit(1);
          if(!(Number(data.knowledge?.diaryPosts)>0)){
           console.error("No current/latest diary supplied to Gemini");
           process.exit(1);
          }
          const spoken=/(^|[^\p{L}])(?:шо|як|якой|тока|токмо|энто|энтот|ентова|ентим|энтим|ежли|тута|тама|хто|куды|шоб|али|нема|хошь|тож|тады|хде|надоть|давеча|драпали|нынче)(?=$|[^\p{L}])/iu;
          const words=data.reply.trim().split(/\s+/u).filter(Boolean).length;
          if(/за энту дату|летописце|записей нет|\d{4}[-.]\d{1,2}/iu.test(data.reply)){console.error("Character leaked bookkeeping/date");process.exit(1);}
          console.log("Voice check on latest events:",{words,hasDialectedWord:spoken.test(data.reply)});
          const lexicalIssues=lintSankoReply(data.reply);
          if(lexicalIssues.length){console.error("Sanko mandatory speech violated:",lexicalIssues);process.exit(1);}
          if(words>30){console.error("Sanko's latest-events reply is too long");process.exit(1);}
          NODE
      - name: Four-turn continuous Sanko voice and story QA
        if: env.LIVE_HEALTH_OK == '1'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const { lintSankoReply } = await import("./quality/sanko/check_reply.mjs");
          const url="https://sanko-chat-api.boysinger2008.workers.dev/api/chat";
          const questions=[
           "Шо у вас нынче стряслось?",
           "А отчего от стражи удирали?",
           "И как вы от них ушли?",
           "Тому купчику веришь?"
          ];
          const conversationId=crypto.randomUUID(),history=[];
          const dialect=/(?:^|[^\p{L}])(?:шо|як|якой|тока|токмо|энто|энтот|енто|ентот|ежли|тута|тама|хто|куды|покуда|знамо|надоть|давеча|нынче|драпали|мя|мене|хошь|али|чаю)(?=$|[^\p{L}])/iu;
          const dates=/\b(?:19|20)\d{2}\b|\d{1,2}[./-]\d{1,2}|январ|феврал|март|апрел|июн|июл|август|сентябр|октябр|ноябр|декабр|за энту дату/iu;
          let dialectTurns=0;
          for(const question of questions){
           const response=await fetch(url,{
            method:"POST",
            headers:{"Origin":"https://socman2023.github.io","Content-Type":"application/json"},
            body:JSON.stringify({message:question,history,conversationId})
           });
           const result=await response.json();
           const reply=result.reply||"";
           console.log(JSON.stringify({question,reply,http:response.status,model:result.model,
            diaryPosts:result.knowledge?.diaryPosts},null,2));
           if(!response.ok || !reply.trim())throw Error("Empty or failed reply");
           const count=reply.trim().split(/\s+/u).length;
           if(count>35)throw Error("Ordinary Sanko answer too long: "+count);
           if(dates.test(reply))throw Error("Character leaked calendar date");
           if(/ночлегом\s+приютили|еле\s+удрали\s+тута(?=[.!?]|$)/iu.test(reply))
            throw Error("Author-corrected awkward Sanko phrasing reappeared");
           if(/чинуш|чинот|далебени|сполохом\s+(?:им\s+)?глаза|доступным\s+записям/iu.test(reply))
            throw Error("Character leaked generic / ungrounded construction");
           if(/мене\s+тож\s+свет\s+нужон/iu.test(reply))
            throw Error("Overused light catchphrase repeated in unrelated conversation");
           const lexicalIssues=lintSankoReply(reply);
           if(lexicalIssues.length)throw Error("Sanko always-on words violated: "+JSON.stringify(lexicalIssues));
           if(dialect.test(reply))dialectTurns++;
           history.push({role:"user",text:question},{role:"model",text:reply});
           if(history.length>10)history.splice(0,2);
          }
          console.log("Voice coverage across natural dialogue:",dialectTurns,"of",questions.length);
          // Full naturalness and factuality also require human review; no minimum dialect word quota.
          NODE

      - name: Verify today's exact date query keeps latest dated diary
        if: env.LIVE_HEALTH_OK == '1'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const todayMoscow=new Date(Date.now()+3*3600000).toISOString().slice(0,10);
          const { lintSankoReply } = await import("./quality/sanko/check_reply.mjs");
          const response=await fetch("https://sanko-chat-api.boysinger2008.workers.dev/api/chat",{
           method:"POST",
           headers:{"Origin":"https://socman2023.github.io","Content-Type":"application/json"},
           body:JSON.stringify({message:"Что сегодня было?",history:[],conversationId:crypto.randomUUID()})
          });
          const data=await response.json();
          console.log(JSON.stringify({http:response.status,expectedToday:todayMoscow,
            focusDate:data.knowledge?.focusDate,diaryPosts:data.knowledge?.diaryPosts,
            model:data.model,reply:data.reply},null,2));
          if(!response.ok||typeof data.reply!=="string"||!data.reply.trim())process.exit(1);
          const words=data.reply.trim().split(/\s+/u).filter(Boolean).length;
          console.log("Default answer words:",words);
          const lexicalIssues=lintSankoReply(data.reply);
          if(lexicalIssues.length)throw Error("Mandatory Sanko words violated: "+JSON.stringify(lexicalIssues));
          if(words>30){console.error("Sanko exceeded 30-word default reply: "+words);process.exit(1);}
          const spoken=/(^|[^\p{L}])(?:шо|як|якой|тока|токмо|энто|энтот|ентова|ентим|энтим|ежли|тута|тама|хто|куды|шоб|али|нема|хошь|тож|тады|хде|надоть|давеча|драпали|нынче)(?=$|[^\p{L}])/iu;
          console.log("Today reply uses distinct dialect form:",spoken.test(data.reply));
          // Natural short Sanko speech need not contain a marked dialect word in every sentence.
          if(/(?:19|20)\d\d|\d{1,2}[.\/-]\d{1,2}|январ|феврал|март|апрел|ма[йя]|июн|июл|август|сентябр|октябр|ноябр|декабр|за энту дату|доступн.{0,15}летопис/iu.test(data.reply)){
           console.error("Spoken reply leaked calendar dates or bookkeeping");
           process.exit(1);
          }
          if(data.knowledge?.focusDate!==todayMoscow) {
           console.error("Today date parser failed");process.exit(1);
          }
          if(!(Number(data.knowledge?.diaryPosts)>0)) {
           console.error("Today question lost last available diary");process.exit(1);
          }
          NODE
