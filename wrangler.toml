# GitHub-connected Cloudflare Worker for Sanko only.
# Entry point remains in worker/src/. Do not deploy over Oleshka Worker.
name = "sanko-chat-api"
main = "worker/src/index.js"
compatibility_date = "2026-10-31"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://socman2023.github.io"

# Dedicated D1 database for Sanko's conversations and rate limits.
# Do not use the Oleshka database heroes-chat-guard here.
[[d1_databases]]
binding = "GUARD_DB"
database_name = "heroes-chat-sanko"
database_id = "d566ac31-19ce-463f-80e5-6ed1b0d56b16"
migrations_dir = "worker/migrations"

# Additional AI / Vectorize / KV bindings will be configured separately.
# Never commit Gemini, VK or IP hash secrets.
