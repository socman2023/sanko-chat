# GitHub-connected Cloudflare Worker for Sanko only.
# Entry point remains in worker/src/. Do not deploy over Oleshka Worker.
name = "sanko-chat-api"
main = "worker/src/index.js"
compatibility_date = "2026-10-31"
workers_dev = true
# Preserve VK_OWNER_USER_ID and other dashboard variables between GitHub deployments.
keep_vars = true

# Persist all diagnostic console events and invocation logs in Workers Logs.
# Free plan: 200,000 events/day; retention 3 days; no API keys or chat text.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[vars]
ALLOWED_ORIGIN = "https://socman2023.github.io"
# Public ID of Sanko's own VK Mini App. NOT Sanko's personal VK profile ID.
VK_APP_ID = "54875852"
# Sanko personal VK page ID (public), NOT the Mini App ID nor Oleshka's page.
VK_OWNER_USER_ID = "1029851985"
# Same approved Gemini cascade as working Oleshka Worker v3.9.1.
# Primary is used first; fallbacks only for retryable overload, timeout,
# transient API errors or empty/truncated answers. Billing tier unchanged.
GEMINI_MODEL_ORDER = "gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.6-flash,gemini-3.8-flash"

# Dedicated D1 database for Sanko's conversations and rate limits.
# Do not use the Oleshka database heroes-chat-guard here.
[[d1_databases]]
binding = "GUARD_DB"
database_name = "heroes-chat-sanko"
database_id = "d566ac31-19ce-463f-80e5-6ed1b0d56b16"
migrations_dir = "worker/migrations"

# Existing Oleshka diary database: READ from Sanko code using SELECT only.
# Does NOT change Oleshka's Worker, D1 schema, Cron or quotas.
[[d1_databases]]
binding = "DIARY_DB"
database_name = "heroes-chat-guard"
database_id = "3d356f87-0894-4c03-8dac-a3b82ae2ed6c"

# Shared Workers AI catalog, same account as the working Oleshka Worker.
[ai]
binding = "AI"

# Reuse the shared world index, but query only character=shared/sanko.
# No new Vectorize index is created and no indexed data is changed.
[[vectorize]]
binding = "KNOWLEDGE"
index_name = "heroes-knowledge"

# Existing shared KV namespace, with strict Sanko-only key prefix "sanko:".
# This is NOT a new namespace; do not write to Oleshka's "oleshka:" keys.
[[kv_namespaces]]
binding = "CURRENT_CONTEXT"
id = "64705cefb4f54ff7bed3da7c5f0cb472"

# Secrets stay in Cloudflare, never in this repository.
